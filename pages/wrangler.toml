# Corporate Bingo on Cloudflare Pages + Functions + D1: free plan only, no custom domain (https://corporate-bingo.pages.dev).
# Deploy with:  bun run pages:deploy   (see README.md in this folder). Secrets are NOT in this file.
name = "corporate-bingo"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]   # billing uses node:crypto HMAC

[[d1_databases]]
